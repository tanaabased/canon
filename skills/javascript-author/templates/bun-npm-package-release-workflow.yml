name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TERM: xterm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate source
        run: |
          bun run lint
          bun run test

      - name: Export formatted release date
        run: echo "RELEASE_DATE=$(date -d "${{ github.event.release.published_at }}" "+%B %e, %Y" | tr -s ' ')" >> "$GITHUB_ENV"

      - name: Prepare release
        uses: tanaabased/prepare-release-action@v1
        with:
          commands: |
            # Add command-owned manifest or artifact stamping above the formatter.
            bun run format:write
          sync-verified: true
          update-files: CHANGELOG.md
          update-files-header: |
            ## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})
          update-files-meta: |
            UNRELEASED_DATE=${{ env.RELEASE_DATE }}
            UNRELEASED_LINK=${{ github.event.release.html_url }}
            UNRELEASED_VERSION=${{ github.event.release.tag_name }}

      # Add `bun run build` here only when the npm package ships generated output.
      - name: Validate prepared package
        run: |
          bun run format:check
          npm install --global npm@^11.5.1

      - name: Publish stable package
        if: ${{ github.event.release.prerelease == false }}
        run: |
          npm publish --access public --dry-run
          npm publish --access public

      - name: Publish prerelease package
        if: ${{ github.event.release.prerelease == true }}
        run: |
          npm publish --access public --tag edge --dry-run
          npm publish --access public --tag edge

      # Remove this step when stable releases should not also move the edge tag.
      # Trusted publishing does not authorize npm dist-tag, so this one step needs
      # a separately scoped granular npm token.
      - name: Synchronize edge tag to stable
        if: ${{ github.event.release.prerelease == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TANAAB_NPM_DEPLOY }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm dist-tag add "$PACKAGE@$VERSION" edge
