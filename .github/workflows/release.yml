name: Release

on:
  release:
    types:
      - published

jobs:
  publish-codex-plugin:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "${{ github.event.release.tag_name }}"
            bun run format:write
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Publish Codex plugin
        uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          archive-name: tanaab-${{ github.event.release.tag_name }}.tar.gz
          dependency-policy: include-production
          github-token: ${{ github.token }}
          release-tag: ${{ github.event.release.tag_name }}

  publish-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Validate Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
      - name: Publish repository
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "${{ github.event.release.tag_name }}"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
