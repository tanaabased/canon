name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_RELEASE_DATE: '2026-09-17T00:00:00Z'
  STAMPED_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v9.9.9-ci.${{ github.event.pull_request.head.sha }}
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check canon
        run: |
          bun run lint
          bun run codex:validate
      - name: Prepare release-shaped build
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
            bun run codex:validate
          release-date: ${{ env.STAMPED_RELEASE_DATE }}
          release-url: ${{ env.STAMPED_RELEASE_URL }}
          version: ${{ env.STAMPED_VERSION }}
      - name: Verify generated formatting
        run: bun run format:check
      - name: Prepare Codex plugin archive
        id: publish
        uses: tanaabased/actions/publish-codex-plugin@v1
        with:
          archive-name: tanaab-${{ env.STAMPED_VERSION }}.tar.gz
          dependency-policy: include-production
          release-tag: ${{ env.STAMPED_VERSION }}
          test-mode: true
      - name: Verify release archive
        env:
          ARCHIVE_PATH: ${{ steps.publish.outputs.archive-path }}
        run: |
          archive_root="$(mktemp -d)"
          tar -xzf "$ARCHIVE_PATH" -C "$archive_root"
          cd "$archive_root"

          test "$(basename "$ARCHIVE_PATH")" = "tanaab-${STAMPED_VERSION}.tar.gz"
          test -f .codex-plugin/plugin.json
          test -f skills/github-workflow-author/SKILL.md
          test -x bin/codexsync.js

          package_version="v$(bun --eval 'const pkg = JSON.parse(await Bun.file("package.json").text()); console.log(pkg.version)')"
          plugin_version="v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          cli_version="v$(./bin/codexsync.js --version)"
          printf 'package=%s\nplugin=%s\ncli=%s\n' "$package_version" "$plugin_version" "$cli_version"
          test "$package_version" = "$STAMPED_VERSION"
          test "$plugin_version" = "$STAMPED_VERSION"
          test "$cli_version" = "$STAMPED_VERSION"
          grep -F "## ${STAMPED_VERSION} - [September 17, 2026](${STAMPED_RELEASE_URL})" CHANGELOG.md

          if test -d node_modules/mocha; then
            echo 'release archive must not include dev dependencies' >&2
            exit 1
          fi

  publish-repo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test repository publication
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            bun install --frozen-lockfile --ignore-scripts
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
            bun run codex:validate
          release-date: ${{ env.STAMPED_RELEASE_DATE }}
          release-url: ${{ env.STAMPED_RELEASE_URL }}
          test-mode: true
          version: ${{ env.STAMPED_VERSION }}
      - name: Verify prepared repository
        run: |
          bun run format:check
          test "v$(bun --eval 'const pkg = JSON.parse(await Bun.file("package.json").text()); console.log(pkg.version)')" = "$STAMPED_VERSION"
          test "v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')" = "$STAMPED_VERSION"
          test "v$(./bin/codexsync.js --version)" = "$STAMPED_VERSION"
          grep -F "## ${STAMPED_VERSION} - [September 17, 2026](${STAMPED_RELEASE_URL})" CHANGELOG.md
