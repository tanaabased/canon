name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check canon
        run: |
          bun run lint
          bun run codex:validate
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: ${{ env.STAMPED_VERSION }}
          sync: false
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "${{ env.STAMPED_VERSION }}"
            bun run format:write
      - name: Verify generated formatting
        run: bun run format:check
      - name: Verify stamped versions
        shell: bash
        run: |
          package_version="v$(bun --eval 'const pkg = JSON.parse(await Bun.file("package.json").text()); console.log(pkg.version)')"
          plugin_version="v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')"
          cli_version="v$(./bin/codexsync.js --version)"
          tagged_version="$(git tag --points-at HEAD --list "$STAMPED_VERSION")"
          printf 'package=%s\nplugin=%s\ncli=%s\ntag=%s\n' "$package_version" "$plugin_version" "$cli_version" "$tagged_version"
          test "$package_version" = "$STAMPED_VERSION"
          test "$plugin_version" = "$STAMPED_VERSION"
          test "$cli_version" = "$STAMPED_VERSION"
          test "$tagged_version" = "$STAMPED_VERSION"
      - name: Install production dependencies
        run: |
          rm -rf node_modules
          bun install --production --frozen-lockfile --ignore-scripts
      - name: Package release archive
        env:
          RELEASE_ARCHIVE: tanaab-${{ env.STAMPED_VERSION }}.tar.gz
        run: |
          tar \
            --exclude-vcs \
            -czf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" \
            -C "${GITHUB_WORKSPACE}" \
            .
      - name: Verify release archive contents
        env:
          RELEASE_ARCHIVE: tanaab-${{ env.STAMPED_VERSION }}.tar.gz
        run: |
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F '.codex-plugin/plugin.json'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'skills/github-workflow-author/SKILL.md'
          tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -F 'bin/codexsync.js'
          if tar -tzf "${RUNNER_TEMP}/${RELEASE_ARCHIVE}" | grep -E '(^|/)node_modules/mocha/'; then
            echo 'release archive must not include dev dependencies' >&2
            exit 1
          fi
