name: Release Tests

on:
  pull_request:

permissions:
  contents: read

env:
  STAMPED_RELEASE_DATE: '2026-09-17T00:00:00Z'
  STAMPED_RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/v9.9.9-ci.${{ github.event.pull_request.head.sha }}
  STAMPED_VERSION: v9.9.9-ci.${{ github.event.pull_request.head.sha }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Node.js
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Prepare release-shaped build
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          release-date: ${{ env.STAMPED_RELEASE_DATE }}
          release-url: ${{ env.STAMPED_RELEASE_URL }}
          version: ${{ env.STAMPED_VERSION }}
      - name: Verify generated formatting
        run: bun run format:check
      - name: Pack plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Check extracted package
        id: package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball-path }}
        run: |
          package_root="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$package_root" --strip-components=1
          echo "path=$package_root" >> "$GITHUB_OUTPUT"
          bun run check:package "$package_root"
          grep -F "## ${STAMPED_VERSION} - [September 17, 2026](${STAMPED_RELEASE_URL})" "$package_root/CHANGELOG.md"
      - name: Validate extracted plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: ${{ steps.package.outputs.path }}
      - name: Dry-run publication
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          dry-run: true

  publish-repo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test repository publication
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            bun install --frozen-lockfile --ignore-scripts
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          release-date: ${{ env.STAMPED_RELEASE_DATE }}
          release-url: ${{ env.STAMPED_RELEASE_URL }}
          dry-run: true
          version: ${{ env.STAMPED_VERSION }}
      - name: Verify prepared repository
        run: |
          bun run format:check
          test "v$(bun --eval 'const pkg = JSON.parse(await Bun.file("package.json").text()); console.log(pkg.version)')" = "$STAMPED_VERSION"
          test "v$(bun --eval 'const plugin = JSON.parse(await Bun.file(".codex-plugin/plugin.json").text()); console.log(plugin.version)')" = "$STAMPED_VERSION"
          grep -F "## ${STAMPED_VERSION} - [September 17, 2026](${STAMPED_RELEASE_URL})" CHANGELOG.md
      - name: Validate prepared repository plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
