name: Example Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  examples:
    name: ${{ matrix.example }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        example:
          - openclaw
          - skill-tools
          - cli-templates
    env:
      LEIA_TIMEOUT: '120'
      OPENCLAW_HIDE_BANNER: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          package-field: openclaw.build.openclawVersion
      - name: Pack candidate
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Run example
        uses: tanaabased/actions/run-leia@v1
        env:
          CANON_TARBALL: ${{ steps.pack.outputs.tarball-path }}
        with:
          scenarios: examples/${{ matrix.example }}/README.md
          shell: bash
